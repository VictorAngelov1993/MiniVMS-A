spring.application.name=payment-service
#Port
server.port=8081
#Data Source
#Use Below to start the app on local machine
spring.datasource.url=jdbc:mysql://localhost:3306/payment_service_beta?useSSL=false&serverTimezone=UTC
#Use below to start the app in container
#spring.datasource.url=jdbc:mysql://host.docker.internal:3306/mini_vms_beta_v1?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456
#JPA/Hibernate
# uncomment to refresh the database.
#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

