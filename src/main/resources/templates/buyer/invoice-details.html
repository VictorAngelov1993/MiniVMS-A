<!-- Inside <main> of buyer/invoice-details.html -->
<div class="d-flex justify-content-between align-items-center mb-4">
  <h1 class="h3 mb-0">Invoice Details</h1>
  <a class="btn btn-outline-secondary" href="/buyer/invoices" th:href="@{/buyer/invoices}">
    <i class="bi bi-arrow-left" aria-hidden="true"></i> Back to Invoices
  </a>
</div>

<div class="card card-compact bg-white">
  <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
    <div>
      <h2 class="h5 mb-0 fw-bold">
        <i class="bi bi-receipt me-2 text-primary" aria-hidden="true"></i>
        Invoice: <span th:text="${invoice.invoiceId}">INV-2026-0001</span>
      </h2>
      <small class="text-muted">
        Supplier: <strong th:text="${invoice.supplierName}">Supplier Name</strong>
      </small>
    </div>
    <span class="badge bg-success status-badge" th:text="${invoice.status}">ISSUED</span>
  </div>

  <div class="card-body p-4">
    <div class="table-responsive">
      <table class="table table-bordered align-middle mb-0">
        <thead class="table-light">
        <tr>
          <th scope="col">Time Sheet ID</th>
          <th scope="col">Worker Full Name</th>
          <th scope="col" class="text-end">Total Hours</th>
          <th scope="col" class="text-end">Total Amount ($)</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${invoice.lineItems}">
          <td class="fw-semibold text-secondary" th:text="${item.timesheetId}">tsid1</td>
          <td th:text="${item.workerFullName}">John Doe</td>
          <td class="text-end" th:text="${#numbers.formatDecimal(item.totalHours, 1, 2)}">40.00</td>
          <td class="text-end fw-semibold" th:text="'$' + ${#numbers.formatDecimal(item.totalAmount, 1, 2)}">$1,600.00</td>
        </tr>
        </tbody>
        <tfoot>
        <tr class="table-light fw-bold fs-5">
          <td colspan="3" class="text-end">Total Amount:</td>
          <td class="text-end text-primary" th:text="'$' + ${#numbers.formatDecimal(invoice.grandTotal, 1, 2)}">$3,200.00</td>
        </tr>
        </tfoot>
      </table>
    </div>
  </div>
</div>
