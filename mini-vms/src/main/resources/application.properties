#Project name
spring.application.name=MiniVMS
#Port
server.port=8080
#Data Source
#Use Below to start the app on local machine
spring.datasource.url=jdbc:mysql://localhost:3306/mini_vms_beta_v1?useSSL=false&serverTimezone=UTC
#Use below to start the app in container
#spring.datasource.url=jdbc:mysql://host.docker.internal:3306/mini_vms_beta_v1?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456
#JPA/Hibernate
# uncomment the create-drop to refresh the database.
#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#Logging
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql=TRACE

#JSON Web Token properties

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:3600000}

# Uncomment below for easy testing
#app.jwt.secret=change-this-to-a-long-random-secret-key-min-32-chars
#app.jwt.expiration-ms=3600000

# Uncomment below for logging
#logging.level.org.springframework.security=DEBUG
#logging.level.org.springframework.web=DEBUG
#logging.level.org.springframework.web.servlet.mvc.method.annotation=DEBUG
#
#logging.level.org.springframework.security.web.csrf=DEBUG
#logging.level.org.springframework.security.web.access=DEBUG
#logging.level.org.springframework.security.web.authentication=DEBUG
#logging.level.org.springframework.security.web.FilterChainProxy=TRACE
#
#
#logging.level.org.thymeleaf=DEBUG
#logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Set default log level (INFO)
logging.level.root=INFO
logging.level.springbootapp.minivms=INFO

# Write logs to a rolling file per service
logging.file.name=logs/minivms.log