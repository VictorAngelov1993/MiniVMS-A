<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${errorTitle}">Error - MiniVMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/styles.css" th:href="@{/css/styles.css}" rel="stylesheet">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

<main class="container d-flex flex-column justify-content-center align-items-center text-center flex-grow-1">

    <div class="mb-4">
        <i class="bi bi-exclamation-triangle-fill text-danger"
           style="font-size: 4rem;"></i>
    </div>

    <h1 class="h3 mb-3"
        th:text="${errorTitle}">
        Something went wrong
    </h1>

    <p class="text-muted mb-4"
       th:text="${errorMessage}">
        An unexpected error occurred.
    </p>

    <div class="d-flex gap-2">
        <button class="btn btn-outline-secondary"
                onclick="history.back()">
            <i class="bi bi-arrow-left"></i>
            Go Back
        </button>
    </div>

</main>

<footer class="app-footer mt-auto py-3 bg-white border-top">
    <div class="container d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2">
        <span class="text-muted">&copy; 2026 MiniVMS. All rights reserved.</span>
        <span class="text-muted small">Version 1.0.0</span>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
