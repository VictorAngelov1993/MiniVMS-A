<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check Budget - MiniVMS</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/css/styles.css" th:href="@{/css/styles.css}" rel="stylesheet">

  <style>
    .budget-display-card {
      background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
      border: 1.5px solid #10b981;
      border-radius: 12px;
      padding: 2rem;
      text-align: center;
    }

    .budget-amount {
      font-size: 2.75rem;
      font-weight: 700;
      color: #047857;
      letter-spacing: -0.5px;
    }

    .btn-budget {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      border: none;
      border-radius: 50px;
      padding: 0.5rem 1.5rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
      transition: all 0.25s ease;
    }

    .btn-budget:hover {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.45);
    }
  </style>
</head>

<body>

<header th:replace="~{components/header :: app-header(pageTitle='Check Budget')}" class="app-header bg-primary"></header>

<div class="container-fluid app-shell">
  <div class="row">

    <nav class="col-12 col-md-3 col-lg-2 app-sidebar" aria-label="Main navigation">
      <ul class="nav flex-column">
        <li class="nav-item">
          <a class="nav-link" th:href="${user != null ? user.roleHomeUrl : '/'}">
            <i class="bi bi-house" aria-hidden="true"></i> Home
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/profile" th:href="@{/profile}">
            <i class="bi bi-person" aria-hidden="true"></i> Profile
          </a>
        </li>
      </ul>
    </nav>

    <main class="col-12 col-md-9 col-lg-10 app-content">
      <h1 class="h3 mb-4">My Account Budget</h1>

      <div class="card shadow-sm" style="max-width: 600px;">
        <div class="card-body p-4">

          <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show mb-4" role="alert">
            <span th:text="${successMessage}">Success message</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>

          <div class="budget-display-card mb-4">
            <div class="text-uppercase text-muted fw-semibold small mb-2 tracking-wide">
              <i class="bi bi-wallet2 text-success me-1"></i> Current Available Balance
            </div>
            <div class="budget-amount">
              $<span th:text="${budgetAmount != null ? #numbers.formatDecimal(budgetAmount, 1, 'COMMA', 2, 'POINT') : '0.00'}">0.00</span>
            </div>
          </div>

          <p class="text-muted text-center mb-4">
            Need funds for your upcoming orders? You can top up your balance securely at any time.
          </p>

          <hr>

          <div class="d-flex justify-content-between align-items-center mt-3">
            <a th:href="@{/profile}" class="btn btn-secondary">
              <i class="bi bi-arrow-left"></i> Back to Profile
            </a>

            <a th:href="@{/budgets/add}" class="btn btn-budget d-inline-flex align-items-center gap-2">
              <i class="bi bi-plus-circle-fill"></i>
              <span>Add Budget</span>
            </a>
          </div>

        </div>
      </div>

    </main>
  </div>
</div>

<footer th:replace="~{components/footer :: app-footer}" class="app-footer mt-auto"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/main.js" th:src="@{/js/main.js}"></script>

</body>
</html>
