<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Budget - MiniVMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/styles.css" th:href="@{/css/styles.css}" rel="stylesheet">

    <style>
        /* Matching Primary Add Budget button */
        .btn-budget {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff;
            border: none;
            border-radius: 50px;
            padding: 0.55rem 1.5rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            transition: all 0.25s ease;
        }

        .btn-budget:hover {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.45);
        }

        .btn-budget:active {
            transform: translateY(0);
        }
    </style>
</head>

<body>

<header th:replace="~{components/header :: app-header(pageTitle='Add Budget')}" class="app-header bg-primary"></header>

<div class="container-fluid app-shell">
    <div class="row">

        <!-- Sidebar -->
        <nav class="col-12 col-md-3 col-lg-2 app-sidebar" aria-label="Main navigation">
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link" th:href="${user != null ? user.roleHomeUrl : '/'}">
                        <i class="bi bi-house" aria-hidden="true"></i> Home
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/profile" th:href="@{/profile}">
                        <i class="bi bi-person" aria-hidden="true"></i> Profile
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Main content -->
        <main class="col-12 col-md-9 col-lg-10 app-content">
            <h1 class="h3 mb-4">Add Budget</h1>

            <div class="card shadow-sm" style="max-width: 550px;">
                <div class="card-body p-4">

                    <form th:action="@{/budgets/add}" method="post">
                        <!-- CSRF Token for Spring Security -->
                        <input type="hidden" name="_csrf" th:if="${_csrf}" th:value="${_csrf.token}"/>

                        <!-- Single Section: Amount Input -->
                        <div class="mb-4">
                            <label for="amountToAdd" class="form-label fw-semibold">Amount to Add</label>
                            <div class="input-group input-group-lg">
                                <span class="input-group-text bg-light text-success fw-bold">$</span>
                                <input type="number"
                                       class="form-control"
                                       id="amountToAdd"
                                       name="amountToAdd"
                                       step="0.01"
                                       min="0.01"
                                       placeholder="0.00"
                                       required
                                       autofocus>
                            </div>
                            <div class="form-text text-muted mt-2">
                                Enter the funds you wish to deposit into your buyer account.
                            </div>
                        </div>

                        <hr>

                        <!-- Action Buttons -->
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <a th:href="@{/profile}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Cancel
                            </a>

                            <button type="submit" class="btn btn-budget d-inline-flex align-items-center gap-2">
                                <i class="bi bi-plus-circle-fill"></i>
                                <span>Confirm & Add</span>
                            </button>
                        </div>
                    </form>

                </div>
            </div>

        </main>
    </div>
</div>

<footer th:replace="~{components/footer :: app-footer}" class="app-footer mt-auto"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/main.js" th:src="@{/js/main.js}"></script>

</body>
</html>
