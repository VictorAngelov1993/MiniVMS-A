<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile - MiniVMS</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/css/styles.css" th:href="@{/css/styles.css}" rel="stylesheet">

  <style>
    .btn-budget {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      border: none;
      border-radius: 50px;
      padding: 0.5rem 1.25rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
      transition: all 0.25s ease;
    }

    .btn-budget:hover {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.45);
    }

    .btn-budget:active {
      transform: translateY(0);
    }

    .btn-check-budget {
      background-color: #ecfdf5;
      color: #059669;
      border: 1.5px solid #10b981;
      border-radius: 50px;
      padding: 0.45rem 1.2rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      transition: all 0.25s ease;
    }

    .btn-check-budget:hover {
      background-color: #10b981;
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
    }

    .btn-check-budget:active {
      transform: translateY(0);
    }

    .btn-get-payment {
      background-color: #eff6ff;
      color: #1d4ed8;
      border: 1.5px solid #3b82f6;
      border-radius: 50px;
      padding: 0.45rem 1.2rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      transition: all 0.25s ease;
    }

    .btn-get-payment:hover {
      background-color: #2563eb;
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }

    .btn-get-payment:active {
      transform: translateY(0);
    }
  </style>
</head>

<body>

<header th:replace="~{components/header :: app-header(pageTitle='Profile')}" class="app-header bg-primary"></header>

<div class="container-fluid app-shell">
  <div class="row">

    <nav class="col-12 col-md-3 col-lg-2 app-sidebar" aria-label="Profile navigation">
      <ul class="nav flex-column">
        <li class="nav-item">
          <a class="nav-link" th:href="${user.roleHomeUrl}">
            <i class="bi bi-house" aria-hidden="true"></i> Home
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="/profile" th:href="@{/profile}" aria-current="page">
            <i class="bi bi-person" aria-hidden="true"></i> Profile
          </a>
        </li>
      </ul>
    </nav>

    <main class="col-12 col-md-9 col-lg-10 app-content">
      <h1 class="h3 mb-4">Profile</h1>

      <div class="card shadow-sm">
        <div class="card-body">

          <div class="d-flex align-items-center justify-content-between flex-wrap gap-3 mb-4">
            <div class="d-flex align-items-center">
              <i class="bi bi-person-circle fs-1 me-3 text-primary"></i>
              <div>
                <h4 class="mb-0" th:text="${user.fullName}">John Doe</h4>
                <div class="text-muted" th:text="${user.email}">john.doe@example.com</div>
              </div>
            </div>

            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
              <span th:text="${successMessage}">Success message here</span>
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
              <span th:text="${errorMessage}">Error message here</span>
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="d-flex flex-wrap gap-2">
              <a th:href="@{/profile/edit}" class="btn btn-outline-primary d-inline-flex align-items-center gap-2">
                <i class="bi bi-pencil-square"></i>
                <span>Edit Profile</span>
              </a>

              <th:block th:if="${#strings.equalsIgnoreCase(user.role, 'Buyer')}">
                <a th:href="@{/budgets}" class="btn btn-check-budget d-inline-flex align-items-center gap-2">
                  <i class="bi bi-cash-stack fs-5"></i>
                  <span>Check Budget</span>
                </a>

                <a th:href="@{/budgets/add}" class="btn btn-budget d-inline-flex align-items-center gap-2">
                  <i class="bi bi-wallet2 fs-5"></i>
                  <span>Add Budget</span>
                  <i class="bi bi-plus-circle-fill"></i>
                </a>

                <button type="button"
                        class="btn btn-get-payment d-inline-flex align-items-center gap-2"
                        data-bs-toggle="modal"
                        data-bs-target="#getPaymentModal">
                  <i class="bi bi-receipt fs-5"></i>
                  <span>Get Payment</span>
                </button>
              </th:block>
            </div>
          </div>

          <hr>

          <div class="mb-3">
            <label class="form-label fw-semibold">Full Name</label>
            <div th:text="${user.fullName}">John Doe</div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Email</label>
            <div th:text="${user.email}">john.doe@example.com</div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Role</label>
            <div>
              <span class="badge bg-light text-dark border px-3 py-2" th:text="${user.role}">Buyer</span>
            </div>
          </div>

          <hr>

          <div class="d-flex justify-content-between align-items-center">
            <a th:href="${user.roleHomeUrl}" class="btn btn-secondary">
              <i class="bi bi-arrow-left"></i> Back
            </a>

            <form action="/logout" method="post" th:action="@{/logout}">
              <input type="hidden" name="_csrf" th:if="${_csrf}" th:value="${_csrf.token}"/>
              <button class="btn btn-danger">
                <i class="bi bi-box-arrow-right"></i> Logout
              </button>
            </form>
          </div>

        </div>
      </div>

    </main>
  </div>
</div>

<!-- Get Payment Modal (Buyer) -->
<div class="modal fade" id="getPaymentModal" tabindex="-1" aria-labelledby="getPaymentModalLabel" aria-hidden="true"
     th:if="${#strings.equalsIgnoreCase(user.role, 'Buyer')}">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="getPaymentModalLabel">
          <i class="bi bi-receipt me-2"></i>Get Payment by Invoice ID
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <form id="getPaymentForm">
        <div class="modal-body">
          <div class="mb-3">
            <label for="invoiceIdInput" class="form-label fw-semibold">Invoice ID</label>
            <input type="text"
                   class="form-control"
                   id="invoiceIdInput"
                   name="invoiceId"
                   placeholder="e.g. INV-001"
                   maxlength="50"
                   required>
          </div>

          <div id="paymentErrorAlert" class="alert alert-danger d-none mb-0" role="alert"></div>

          <div id="paymentResultCard" class="card bg-light border-0 d-none mt-3">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="fw-bold" id="resInvoiceId"></span>
                <span class="badge bg-primary" id="resStatus"></span>
              </div>
              <div class="mb-1"><strong>Supplier:</strong> <span id="resSupplierName"></span></div>
              <div class="mb-1"><strong>Amount:</strong> <span id="resAmount"></span></div>
              <div class="mb-3"><strong>Paid At:</strong> <span id="resPaidAt"></span></div>
              <div class="d-flex justify-content-end">
                <button type="button" class="btn btn-sm btn-outline-primary" id="downloadPaymentBtn">
                  <i class="bi bi-download me-1"></i> Download PDF
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="submit" class="btn btn-primary" id="fetchPaymentBtn">
            <i class="bi bi-search me-1"></i> Fetch Payment
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<footer th:replace="~{components/footer :: app-footer}" class="app-footer mt-auto"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/main.js" th:src="@{/js/main.js}"></script>

<script th:if="${#strings.equalsIgnoreCase(user.role, 'Buyer')}">
  document.addEventListener('DOMContentLoaded', () => {
    const form = document.getElementById('getPaymentForm');
    const input = document.getElementById('invoiceIdInput');
    const errorAlert = document.getElementById('paymentErrorAlert');
    const resultCard = document.getElementById('paymentResultCard');
    const submitBtn = document.getElementById('fetchPaymentBtn');
    const downloadBtn = document.getElementById('downloadPaymentBtn');
    let currentInvoiceId = null;

    if (!form) return;

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const invoiceId = input.value.trim();
      if (!invoiceId) return;

      currentInvoiceId = null;
      errorAlert.classList.add('d-none');
      errorAlert.textContent = '';
      resultCard.classList.add('d-none');
      submitBtn.disabled = true;

      try {
        const response = await fetch(`/buyer/payments/${encodeURIComponent(invoiceId)}`, {
          headers: { 'Accept': 'application/json' }
        });

        if (!response.ok) {
          const msg = response.status === 404
                  ? `No payment found for invoice "${invoiceId}".`
                  : `Could not retrieve payment (HTTP ${response.status}).`;
          throw new Error(msg);
        }

        const data = await response.json();
        currentInvoiceId = data.invoiceId ?? invoiceId;
        document.getElementById('resInvoiceId').textContent = currentInvoiceId;
        document.getElementById('resSupplierName').textContent = data.supplierName ?? '-';
        document.getElementById('resAmount').textContent = data.amount != null ? Number(data.amount).toFixed(2) : '-';
        document.getElementById('resStatus').textContent = data.status ?? '-';
        document.getElementById('resPaidAt').textContent = data.paidAt ?? 'Not paid yet';

        resultCard.classList.remove('d-none');
      } catch (err) {
        errorAlert.textContent = err.message || 'Failed to fetch payment details.';
        errorAlert.classList.remove('d-none');
      } finally {
        submitBtn.disabled = false;
      }
    });

    if (downloadBtn) {
      downloadBtn.addEventListener('click', () => {
        if (!currentInvoiceId) return;
        window.location.href = `/buyer/payments/${encodeURIComponent(currentInvoiceId)}/pdf`;
      });
    }
  });
</script>

</body>
</html>
