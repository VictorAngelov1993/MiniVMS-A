<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - MiniVMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/styles.css" th:href="@{/css/styles.css}" rel="stylesheet">
</head>

<body>

<header th:replace="~{components/header :: app-header(pageTitle='Edit Profile')}" class="app-header bg-primary"></header>

<div class="container-fluid app-shell">
    <div class="row">

        <nav class="col-12 col-md-3 col-lg-2 app-sidebar" aria-label="Profile navigation">
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link" th:href="${user.roleHomeUrl}">
                        <i class="bi bi-house" aria-hidden="true"></i> Home
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/profile" th:href="@{/profile}" aria-current="page">
                        <i class="bi bi-person" aria-hidden="true"></i> Profile
                    </a>
                </li>
            </ul>
        </nav>

        <main class="col-12 col-md-9 col-lg-10 app-content">
            <h1 class="h3 mb-4">Edit Profile</h1>

            <div class="card shadow-sm">
                <div class="card-body">

                    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <span th:text="${errorMessage}">Error message here</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <form th:action="@{/profile/edit}" th:object="${profileEditDto}" method="post">
                        <input type="hidden" name="_csrf" th:if="${_csrf}" th:value="${_csrf.token}"/>

                        <div class="mb-3">
                            <label for="firstName" class="form-label fw-semibold">First Name</label>
                            <input id="firstName"
                                   type="text"
                                   class="form-control"
                                   th:field="*{firstName}"
                                   th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid' : ''"
                                   placeholder="Enter first name">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}">
                                First name error
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="lastName" class="form-label fw-semibold">Last Name</label>
                            <input id="lastName"
                                   type="text"
                                   class="form-control"
                                   th:field="*{lastName}"
                                   th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid' : ''"
                                   placeholder="Enter last name">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}">
                                Last name error
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="email" class="form-label fw-semibold">Email</label>
                            <input id="email"
                                   type="email"
                                   class="form-control"
                                   th:field="*{email}"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                   placeholder="Enter email address">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
                                Email error
                            </div>
                        </div>

                        <hr>

                        <div class="d-flex justify-content-between align-items-center">
                            <a th:href="@{/profile}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Cancel
                            </a>

                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg"></i> Save Changes
                            </button>
                        </div>
                    </form>

                </div>
            </div>

        </main>
    </div>
</div>

<footer th:replace="~{components/footer :: app-footer}" class="app-footer mt-auto"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/main.js" th:src="@{/js/main.js}"></script>

</body>
</html>
